version: '3.8'

services:
  app:
    build: .
    container_name: fastapi-template-app
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

